<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo"><span class="logo-icon">◐</span><span class="logo-text">Lumen</span></div>
        <div class="header-actions">
          <button id="settings-btn" class="btn-icon" title="Settings">⚙</button>
          <button id="theme-toggle" class="btn-icon" title="Theme">☼</button>
          <button id="new-char-btn" class="btn-primary">+</button>
        </div>
      </div>
      <div class="sidebar-tabs">
        <button class="tab active" data-tab="characters">Characters</button>
        <button class="tab" data-tab="rpgs">Multi-Char</button>
      </div>
      <div class="search-box"><input type="text" id="search-input" placeholder="Search..." /></div>
      <div id="character-list" class="character-list"></div>
      <div id="rpg-list" class="character-list hidden"></div>
      <div class="sidebar-footer">
        <button id="create-rpg-btn" class="btn-secondary full">+ Create Multi-Character</button>
      </div>
    </aside>

    <main id="main">
      <!-- HOME SCREEN -->
      <div id="home-screen" class="home-screen">
        <div class="home-content">
          <div class="home-hero">
            <div class="home-logo">◐</div>
            <h1>Lumen</h1>
            <p class="home-subtitle">Talk to characters. Create worlds.</p>
          </div>

          <div class="home-featured">
            <h2>Featured</h2>
            <div class="featured-grid" id="featured-grid">
              <!-- filled by JS -->
            </div>
          </div>

          <div class="home-actions">
            <button id="home-create-char" class="btn-primary large">Create Character</button>
            <button id="home-create-rpg" class="btn-secondary large">Create Multi-Character</button>
          </div>

          <p class="api-hint" id="api-status">No API key set — click Settings</p>
        </div>
      </div>

      <!-- CHAT VIEW -->
      <div id="chat-view" class="chat-view hidden">
        <header class="chat-header">
          <div class="chat-character-info">
            <div id="chat-avatar" class="avatar">◐</div>
            <div><h2 id="chat-name"></h2><p id="chat-tagline" class="tagline"></p></div>
          </div>
          <button id="back-btn" class="btn-ghost">← Back</button>
        </header>
        <div id="messages" class="messages"></div>
        <div class="chat-input-area">
          <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
          <button id="send-btn" class="btn-primary send-btn">Send</button>
        </div>
      </div>

      <!-- Settings -->
      <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header"><h2>Settings</h2><button id="close-settings" class="btn-ghost">X</button></div>
          <div class="form-body">
            <div class="form-group">
              <label>Provider</label>
              <select id="provider-select">
                <option value="gemini">Google Gemini (Free)</option>
                <option value="groq">Groq (Free & Fast)</option>
                <option value="openai">OpenAI (Paid)</option>
              </select>
            </div>
            <div class="form-group">
              <label>API Key</label>
              <input type="password" id="api-key-input" placeholder="Paste your key here" />
              <div class="field-hint" id="key-hint">Get free key at aistudio.google.com/apikey</div>
            </div>
            <div class="form-group">
              <label>Model</label>
              <select id="model-select"></select>
            </div>
            <div class="form-actions">
              <button id="cancel-settings" class="btn-ghost">Cancel</button>
              <button id="save-settings" class="btn-primary">Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Single Character Modal -->
      <div id="create-modal" class="modal hidden">
        <div class="modal-content scrollable">
          <div class="modal-header"><h2>Create Character</h2><button id="close-modal" class="btn-ghost">X</button></div>
          <form id="create-form" class="form-body">
            <div class="form-group"><label>Avatar</label><input type="text" id="char-avatar" value="◐" /></div>
            <div class="form-group"><label>Name *</label><input type="text" id="char-name" required maxlength="25" placeholder="Name your character" /></div>
            <div class="form-group"><label>Gender *</label>
              <div class="gender-options">
                <label class="radio-chip"><input type="radio" name="gender" value="Male" checked> Male</label>
                <label class="radio-chip"><input type="radio" name="gender" value="Female"> Female</label>
                <label class="radio-chip"><input type="radio" name="gender" value="Non-binary"> Non-binary</label>
              </div>
            </div>
            <div class="form-group"><label>Intro (Public) *</label><textarea id="char-intro" rows="3" placeholder="Short public description..."></textarea></div>
            <div class="form-group"><label>Greeting *</label><textarea id="char-greeting" rows="4" placeholder="First message that sets the scene..."></textarea></div>
            <div class="form-group"><label>Permission *</label>
              <div class="gender-options">
                <label class="radio-chip"><input type="radio" name="permission" value="Public" checked> Public</label>
                <label class="radio-chip"><input type="radio" name="permission" value="Private"> Private</label>
              </div>
            </div>
            <div class="form-group"><label>Tags</label><input type="text" id="char-tags" placeholder="tags, separated, by, commas" /></div>
            <div class="form-group"><label>Background (Private)</label><textarea id="char-background" rows="5" placeholder="Detailed personality and backstory..."></textarea></div>
            <div class="form-group"><label>Dialogue Style</label><textarea id="char-dialogue" rows="3" placeholder="How this character speaks..."></textarea></div>
            <div class="form-actions"><button type="button" id="cancel-create" class="btn-ghost">Cancel</button><button type="submit" class="btn-primary">Create Character</button></div>
          </form>
        </div>
      </div>

      <!-- Multi-Character Modal -->
      <div id="rpg-modal" class="modal hidden">
        <div class="modal-content wide scrollable">
          <div class="modal-header"><h2>Multi-character</h2><button id="close-rpg-modal" class="btn-ghost">X</button></div>
          <form id="rpg-form" class="form-body">
            <div class="form-group center"><label>Avatar</label><input type="text" id="rpg-avatar" value="🎮" style="width:80px;text-align:center" /></div>
            <div class="form-group"><label>Name *</label><input type="text" id="rpg-name" required maxlength="50" placeholder="Scenario name" /></div>
            <div class="form-group"><label>Main Gender *</label>
              <div class="gender-options">
                <label class="radio-chip"><input type="radio" name="rpg-gender" value="Male" checked> Male</label>
                <label class="radio-chip"><input type="radio" name="rpg-gender" value="Female"> Female</label>
                <label class="radio-chip"><input type="radio" name="rpg-gender" value="Non-binary"> Non-binary</label>
              </div>
            </div>
            <div class="form-group"><label>Description (Public) *</label><textarea id="rpg-description" rows="3" placeholder="Story / characters description..."></textarea></div>
            <div class="form-group"><label>Opening *</label><textarea id="rpg-opening" rows="4" placeholder="Opening scenario..."></textarea></div>
            <div class="form-group"><label>Background</label><textarea id="rpg-background" rows="3" placeholder="Extra rules and details..."></textarea></div>
            <div class="form-group">
              <label>Character List * <span id="rpg-char-count">(0)</span></label>
              <div class="field-hint">At least 2 characters required</div>
              <div id="rpg-characters-preview" class="rpg-chars-preview"></div>
              <div class="rpg-add-row">
                <select id="rpg-char-select"><option value="">Select character</option></select>
                <button type="button" id="add-char-to-rpg" class="btn-secondary">+ Add</button>
              </div>
            </div>
            <div class="form-group"><label>Tags</label><input type="text" id="rpg-tags" placeholder="tags, separated, by, commas" /></div>
            <div class="form-group"><label>Visibility *</label>
              <div class="gender-options">
                <label class="radio-chip"><input type="radio" name="rpg-visibility" value="Public" checked> Public</label>
                <label class="radio-chip"><input type="radio" name="rpg-visibility" value="Private"> Private</label>
              </div>
            </div>
            <div class="form-group"><label class="checkbox-label"><input type="checkbox" id="rpg-confirm" required /> I confirm characters are adults (18+)</label></div>
            <div class="form-actions"><button type="button" id="cancel-rpg" class="btn-ghost">Cancel</button><button type="submit" class="btn-primary">Confirm</button></div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
